[tool.poetry]
name = "tender-vendor-discovery"
version = "0.1.0"
description = "Tender document processing, vendor discovery and evidence review"
authors = ["Daria Pavlova"]
license = "MIT"
readme = "README.md"
packages = [{include = "vendor_ai_agent", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0"
openpyxl = "^3.1"
certifi = "^2025.11.12"
pdfplumber = "^0.11.8"
python-docx = "^1.2.0"
pytesseract = "^0.3.13"
pdf2image = "^1.17.0"
pillow = "^12.0.0"
openai = "^1.0"
python-dotenv = "^1.2.1"
streamlit = "^1.30.0"
duckduckgo-search = "^8.1.1"
sqlalchemy = "^2.0.44"
alembic = "^1.17.2"
psycopg2-binary = "^2.9.11"
requests = "^2.32.5"
python-levenshtein = "^0.27.3"
beautifulsoup4 = "^4.12.0"
geopy = "^2.4.0"
httpx = {extras = ["http2"], version = "^0.28.1"}
google-auth = "^2.35.0"
google-auth-oauthlib = "^1.2.0"
google-auth-httplib2 = "^0.2.0"
playwright = "^1.47.0"
dnspython = "^2.4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2,<9.0"
pytest-asyncio = "^1.3.0"

[tool.poetry.scripts]
tender-vendor-discovery = "vendor_ai_agent.cli:main"
tender-vendor-agent = "vendor_ai_agent.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
