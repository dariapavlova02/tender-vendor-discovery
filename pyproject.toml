[tool.poetry]
name = "tender-vendor-ai-agent"
version = "0.1.0"
description = "MVP scaffolding for the Tender Vendor AI Agent"
authors = ["Vendor AI"]
readme = "README.md"
packages = [{include = "vendor_ai_agent", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0"
openpyxl = "^3.1"
certifi = "^2025.11.12"
pdfplumber = "^0.11.8"
python-docx = "^1.2.0"
pytesseract = "^0.3.13"
pdf2image = "^1.17.0"
pillow = "^12.0.0"
openai = "^1.0"
python-dotenv = "^1.2.1"
streamlit = "^1.30.0"
duckduckgo-search = "^8.1.1"
sqlalchemy = "^2.0.44"
alembic = "^1.17.2"
psycopg2-binary = "^2.9.11"
requests = "^2.32.5"
python-levenshtein = "^0.27.3"
beautifulsoup4 = "^4.12.0"
geopy = "^2.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[tool.poetry.scripts]
tender-vendor-agent = "vendor_ai_agent.cli:main"
tender-dashboard = "streamlit:run vendor_ai_agent.dashboard:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
