[tool.poetry]
name = "tender-vendor-ai-agent"
version = "0.1.0"
description = "MVP scaffolding for the Tender Vendor AI Agent"
authors = ["Vendor AI"]
readme = "README.md"
packages = [{include = "vendor_ai_agent", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0"
openpyxl = "^3.1"
certifi = "^2025.11.12"
pdfplumber = "^0.11.8"
python-docx = "^1.2.0"
pytesseract = "^0.3.13"
pdf2image = "^1.17.0"
pillow = "^12.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[tool.poetry.scripts]
tender-vendor-agent = "vendor_ai_agent.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
